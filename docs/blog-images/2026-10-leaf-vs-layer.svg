<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="1600" height="760" role="img" aria-label="Removing vuls's direct import of go-homedir left it in the build, because nine other modules still required it: go.sum stayed at 1,220 lines. Removing the fanal layer, and calling Trivy's lockfile parsers directly, took everything fanal registered out of the scanner build: 2,345 packages became 737 and the binary went from 106.6 MB to 34.1 MB." font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f2328"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#cf222e"/></marker>
  </defs>
  <rect x="0" y="0" width="800" height="380" fill="#ffffff"/>
  <line x1="400" y1="20" x2="400" y2="360" stroke="#d0d7de"/>

  <!-- LEFT: picking a leaf -->
  <text x="20" y="32" font-weight="bold" font-size="15">Removing one dependency</text>
  <text x="20" y="50" fill="#57606a">vuls PR #2461: go-homedir → os.UserHomeDir()</text>

  <rect x="20" y="80" width="110" height="34" rx="4" fill="none" stroke="#1f2328"/>
  <text x="75" y="102" text-anchor="middle" font-weight="bold">vuls</text>

  <rect x="200" y="72" width="180" height="78" rx="4" fill="none" stroke="#1f2328"/>
  <text x="290" y="92" text-anchor="middle" font-weight="bold">9 other modules</text>
  <text x="290" y="110" text-anchor="middle" fill="#57606a" font-size="12">trivy, go-getter,</text>
  <text x="290" y="125" text-anchor="middle" fill="#57606a" font-size="12">go-containerregistry,</text>
  <text x="290" y="140" text-anchor="middle" fill="#57606a" font-size="12">go-cve-dictionary, …</text>

  <rect x="120" y="220" width="160" height="34" rx="4" fill="none" stroke="#1f2328"/>
  <text x="200" y="242" text-anchor="middle" font-weight="bold">go-homedir</text>

  <!-- removed edge -->
  <line x1="75" y1="114" x2="170" y2="218" stroke="#cf222e" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#r)"/>
  <text x="122" y="190" text-anchor="end" fill="#cf222e" font-weight="bold">import removed</text>
  <path d="M102 144 l12 12 M114 144 l-12 12" stroke="#cf222e" stroke-width="2"/>
  <!-- remaining edge -->
  <line x1="270" y1="150" x2="225" y2="218" stroke="#1f2328" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="258" y="192">still require it</text>

  <text x="20" y="300" font-weight="bold">Still in the build.</text>
  <text x="20" y="320">Direct dependencies in go.mod: 60 → 59</text>
  <text x="20" y="338">go.sum: 1,220 → 1,220 lines</text>

  <!-- RIGHT: cutting the layer -->
  <text x="420" y="32" font-weight="bold" font-size="15">Removing the layer they came through</text>
  <text x="420" y="50" fill="#57606a">vuls PR #2476: stop going through fanal</text>

  <rect x="420" y="80" width="130" height="34" rx="4" fill="none" stroke="#1f2328"/>
  <text x="485" y="102" text-anchor="middle" font-weight="bold">vuls scanner</text>

  <rect x="420" y="170" width="130" height="34" rx="4" fill="none" stroke="#1f2328"/>
  <text x="485" y="192" text-anchor="middle" font-weight="bold">fanal</text>

  <rect x="420" y="232" width="200" height="50" rx="4" fill="#f6f8fa" stroke="#8c959f" stroke-dasharray="4 3"/>
  <text x="520" y="252" text-anchor="middle" fill="#57606a">25+ analyzers and what they</text>
  <text x="520" y="270" text-anchor="middle" fill="#57606a">pull in: images, disks, IaC, …</text>

  <rect x="630" y="170" width="150" height="34" rx="4" fill="none" stroke="#1f2328"/>
  <text x="705" y="184" text-anchor="middle" font-weight="bold">Trivy lockfile</text>
  <text x="705" y="200" text-anchor="middle" font-weight="bold">parsers</text>

  <!-- removed edge scanner -> fanal -->
  <line x1="485" y1="114" x2="485" y2="168" stroke="#cf222e" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#r)"/>
  <path d="M479 135 l12 12 M491 135 l-12 12" stroke="#cf222e" stroke-width="2"/>
  <text x="497" y="146" fill="#cf222e" font-weight="bold">no longer called</text>
  <!-- fanal registers analyzers -->
  <line x1="485" y1="204" x2="485" y2="230" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="493" y="222" fill="#57606a" font-size="12">registers</text>
  <!-- fanal wraps parsers -->
  <line x1="550" y1="187" x2="628" y2="187" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="589" y="180" text-anchor="middle" fill="#57606a" font-size="12">wraps</text>
  <!-- new direct edge -->
  <path d="M550 97 H705 V168" fill="none" stroke="#1f2328" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="628" y="90" text-anchor="middle">calls directly</text>

  <text x="420" y="300" font-weight="bold">What only fanal pulled in leaves.</text>
  <text x="420" y="320">Packages in the scanner build: 2,345 → 737</text>
  <text x="420" y="338">Scanner binary: 106.6 MB → 34.1 MB</text>
</svg>
