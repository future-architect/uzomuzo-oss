<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="1600" height="660" role="img" aria-label="On September 8, 2025, two packages were published maliciously from the same account within a minute. chalk had released 22 days earlier, so nothing marked it until its OSV record appeared about 4 hours later. ansi-styles had been silent for 1,061 days, so the release-after-silence marker would have covered it from the first minute until the record took over." font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328">
  <rect x="0" y="0" width="800" height="330" fill="#ffffff"/>

  <!-- event guide lines -->
  <path d="M158.5 52 V70 M158.5 96 V164 M158.5 186 V262" stroke="#1f2328" stroke-width="1.2" fill="none"/>
  <line x1="513.5" y1="52" x2="513.5" y2="262" stroke="#cf222e" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="152" y="30" text-anchor="start" font-weight="bold">13:12–13:13</text>
  <text x="152" y="46" text-anchor="start">malicious versions published</text>
  <text x="508" y="30" text-anchor="start" font-weight="bold" fill="#cf222e">17:07–17:11</text>
  <text x="508" y="46" text-anchor="start" fill="#cf222e">MAL records published</text>

  <!-- lane 1: chalk -->
  <text x="20" y="84" font-weight="bold">chalk@5.6.1</text>
  <text x="122" y="84" fill="#57606a">previous release 22 days earlier</text>
  <text x="20" y="108" fill="#57606a" font-size="12">silence marker</text>
  <text x="20" y="132" fill="#57606a" font-size="12">MAL record</text>
  <text x="166" y="108" fill="#57606a" font-style="italic">none: no silence to mark</text>
  <rect x="159" y="119" width="354.5" height="18" fill="none" stroke="#8c959f" stroke-dasharray="4 3"/>
  <text x="336" y="132" text-anchor="middle" fill="#57606a">nothing in uzomuzo yet (about 4 h)</text>
  <rect x="513.5" y="119" width="266.5" height="18" fill="#ffebe9" stroke="#cf222e"/>
  <text x="646" y="132" text-anchor="middle" fill="#cf222e" font-weight="bold">replace</text>

  <!-- lane 2: ansi-styles -->
  <text x="20" y="178" font-weight="bold">ansi-styles@6.2.2</text>
  <text x="150" y="178" fill="#57606a">previous release 1,061 days earlier</text>
  <text x="20" y="202" fill="#57606a" font-size="12">silence marker</text>
  <text x="20" y="226" fill="#57606a" font-size="12">MAL record</text>
  <rect x="158" y="189" width="572" height="18" fill="#fff8c5" stroke="#9a6700"/>
  <text x="444" y="202" text-anchor="middle" fill="#7d4e00" font-weight="bold">release after silence: shown for 7 days</text>
  <rect x="158" y="213" width="352" height="18" fill="none" stroke="#8c959f" stroke-dasharray="4 3"/>
  <text x="334" y="226" text-anchor="middle" fill="#57606a">no record yet (about 4 h)</text>
  <rect x="510" y="213" width="270" height="18" fill="#ffebe9" stroke="#cf222e"/>
  <text x="645" y="226" text-anchor="middle" fill="#cf222e" font-weight="bold">replace</text>

  <!-- axis -->
  <line x1="140" y1="262" x2="590" y2="262" stroke="#1f2328"/>
  <line x1="620" y1="262" x2="780" y2="262" stroke="#1f2328"/>
  <line x1="594" y1="268" x2="602" y2="256" stroke="#1f2328"/>
  <line x1="608" y1="268" x2="616" y2="256" stroke="#1f2328"/>
  <g font-size="12" text-anchor="middle">
    <line x1="140" y1="262" x2="140" y2="268" stroke="#1f2328"/><text x="140" y="283">13:00</text>
    <line x1="230" y1="262" x2="230" y2="268" stroke="#1f2328"/><text x="230" y="283">14:00</text>
    <line x1="320" y1="262" x2="320" y2="268" stroke="#1f2328"/><text x="320" y="283">15:00</text>
    <line x1="410" y1="262" x2="410" y2="268" stroke="#1f2328"/><text x="410" y="283">16:00</text>
    <line x1="500" y1="262" x2="500" y2="268" stroke="#1f2328"/><text x="500" y="283">17:00</text>
    <line x1="590" y1="262" x2="590" y2="268" stroke="#1f2328"/><text x="590" y="283">18:00</text>
    <line x1="730" y1="262" x2="730" y2="268" stroke="#1f2328"/><text x="730" y="283">Sep 15</text>
  </g>
  <text x="460" y="310" text-anchor="middle" fill="#57606a" font-size="12">September 8, 2025 (UTC), today's uzomuzo rules applied to the published timestamps</text>
</svg>
