name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions: {}

jobs:
  claude:
    if: >-
      contains(github.event.comment.body, '@claude')
      && github.event.comment.user.login == 'kotakanbe'
      && (
        (github.event_name == 'issue_comment' && github.event.issue.pull_request)
        || github.event_name == 'pull_request_review_comment'
      )
    runs-on: ubuntu-latest
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: true
    # The CI claude task runs `/review-until-clean` (full Phase A+B+C).
    # Worst-case budget:
    #   Phase A: ~5-10 min (5 review agents in parallel + iterate)
    #   Phase B: up to ~75 min (5 rounds × 15 min: 10 min pending wait
    #            + 5 min fix/build/test/lint/commit/push)
    #   Phase C: ~1-3 min (paginated discovery + reply/resolve)
    # = ~80-90 min ceiling on heavy PRs. 90 min covers the worst case;
    # under that, the run is force-killed and the next cron tick re-fires
    # via @claude (idempotent: marker / dedup contract preserved).
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Reject fork PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ -z "$PR_NUMBER" ]]; then
            echo "No PR number found; skipping fork check."
            exit 0
          fi
          IS_FORK=$(gh pr view "$PR_NUMBER" --repo "$GH_REPO" --json isCrossRepository --jq '.isCrossRepository')
          if [[ "$IS_FORK" == "true" ]]; then
            echo "::error::Fork PRs are not allowed for automated Claude execution"
            exit 1
          fi

      - name: Determine checkout ref
        id: determine_ref
        env:
          EVENT_NAME: ${{ github.event_name }}
          IS_PR_ISSUE: ${{ github.event.issue.pull_request != '' }}
          PR_NUMBER: ${{ github.event.issue.number }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request_review_comment" ]]; then
            echo "ref=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" == "issue_comment" && "$IS_PR_ISSUE" == "true" ]]; then
            head_sha=$(gh pr view "$PR_NUMBER" --repo "$GH_REPO" --json headRefOid --jq .headRefOid)
            echo "ref=$head_sha" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "ref=${{ github.ref }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ steps.determine_ref.outputs.ref }}
          token: ${{ secrets.GH_ACTIONS_TOKEN }}

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Install tools
        run: go install golang.org/x/tools/cmd/goimports@v0.34.0

      - uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
        with:
          install-only: true

      - name: Resolve PR head ref name
        id: pr_head_ref
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          # Best-effort lookup. The skill can derive headRefName itself
          # from `$PR_NUMBER` later (via its own `gh pr view`), so a
          # transient failure here must NOT fail the whole workflow —
          # we'd otherwise turn a convenience env into a single point
          # of failure for every @claude run. On failure, leave
          # `head_ref` unset; the skill will fall back to its in-skill
          # PR detection.
          if [[ -n "$PR_NUMBER" ]]; then
            if head_ref=$(gh pr view "$PR_NUMBER" --repo "$GH_REPO" --json headRefName --jq .headRefName 2>&1); then
              echo "head_ref=$head_ref" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::Resolve PR head ref name: gh pr view failed (PR_NUMBER=$PR_NUMBER): $head_ref — skill will derive from PR_NUMBER directly"
            fi
          fi

      - uses: anthropics/claude-code-action@1c8b699d43e9bfed42b48ef15da85d89bab70960 # v1.0.94
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GH_ACTIONS_TOKEN }}
          # `Task` is required for /review-until-clean Phase A (launches
          # subagents via Task tool: `code-reviewer`, `architect`, plus 3
          # general-purpose Task invocations for Code Reuse / Quality / PR
          # Hygiene).
          claude_args: "--model opus --allowedTools 'Bash(*)' Edit Write Read Glob Grep Task"
          show_full_output: false
        env:
          CLAUDE_CODE_MAX_TURNS: "50"
          # Exposed to the skill so Phase B Step 7 can detect the PR
          # without relying on `gh pr view` (no-arg form), which fails
          # in detached-HEAD CI checkout. Also exposes the head branch
          # name so `git push` can target the right ref explicitly.
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          PR_HEAD_REF: ${{ steps.pr_head_ref.outputs.head_ref }}
