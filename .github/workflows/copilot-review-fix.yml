name: Auto-fix Copilot Review

on:
  # Auto-trigger (event-driven, fast path): Copilot posts a review or an inline
  # review comment.
  #
  # Note: both `pull_request_review` (submitted) and `pull_request_review_comment`
  # (created) events are unreliable for the Copilot bot due to the agentic
  # architecture's GITHUB_TOKEN-driven event suppression. They are still listened
  # for as a best-effort fast path; the cron-driven fallback in
  # `copilot-clean-label.yml` runs every 30 minutes, so:
  #   - suppressed-event recovery: ≤30 min worst case (next tick fires).
  #   - local-marker TTL recovery: 30–60 min worst case (a fresh
  #     `copilot-fix-local:<HEAD>` marker may cause the first tick to
  #     skip; the next tick is needed to resume — see the marker
  #     freshness check in `copilot-clean-label.yml`).
  #
  # Multiple events for the same PR are deduped by the marker-based check
  # below (`already` / `local_in_progress` jq passes), so the
  # concurrency group below uses `cancel-in-progress: false` and lets
  # queued events run sequentially.
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  # Manual trigger: add 'copilot-review' label to re-run
  pull_request:
    types: [labeled]

permissions: {}

jobs:
  trigger-claude:
    concurrency:
      group: copilot-review-${{ github.event.pull_request.number }}
      # `cancel-in-progress: false` is intentional. With `true`, a new
      # Copilot review/comment event can cancel a label-triggered run
      # before its first step removes the `copilot-review` label,
      # leaving the label stuck on the PR. Re-adding an already-present
      # label fires no event, so the manual retry path breaks. Marker-
      # based dedup later in the job (`already` /
      # `local_in_progress`) already prevents duplicate `@claude` posts,
      # so queueing is the safe choice.
      cancel-in-progress: false
    # Run when: Copilot submits a review OR posts a review comment OR
    # 'copilot-review' label is added by the maintainer.
    # Only for same-repo PRs authored by kotakanbe (fork PRs cannot access
    # GH_ACTIONS_TOKEN).
    if: >-
      github.event.pull_request.user.login == 'kotakanbe'
      && github.event.pull_request.head.repo.full_name == github.repository
      && (
        (github.event_name == 'pull_request_review'
         && github.event.review.state == 'commented'
         && (github.event.review.user.login == 'Copilot'
             || github.event.review.user.login == 'copilot-pull-request-reviewer[bot]')
         && !contains(github.event.review.body || '', 'generated no comments')
         && !contains(github.event.review.body || '', 'generated no new comments'))
        || (github.event_name == 'pull_request_review_comment'
            && (github.event.comment.user.login == 'Copilot'
                || github.event.comment.user.login == 'copilot-pull-request-reviewer[bot]'))
        || (github.event_name == 'pull_request'
            && github.event.label.name == 'copilot-review'
            && github.event.sender.login == 'kotakanbe')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
      # Required for `gh pr edit --remove-label` (label edits route through
      # the Issues API) AND for `gh pr comment` (PR comments are issue comments
      # at the API level), AND for the marker dedup read of issue comments.
      issues: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      REPO: ${{ github.repository }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Remove copilot-review label if present
        if: github.event_name == 'pull_request' && github.event.label.name == 'copilot-review'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! output=$(gh pr edit "$PR_NUMBER" \
            --remove-label copilot-review \
            --repo "$REPO" 2>&1); then
            if echo "$output" | grep -qiE 'label(.+)does not exist|could not find label'; then
              echo "Label 'copilot-review' is not present; nothing to remove."
            else
              echo "Failed to remove 'copilot-review' label: $output" >&2
              exit 1
            fi
          fi

      - name: Post @claude comment to trigger fix
        env:
          # PAT so the resulting issue_comment event triggers claude.yml.
          # GITHUB_TOKEN-posted comments do NOT fire downstream workflow events.
          GH_TOKEN: ${{ secrets.GH_ACTIONS_TOKEN }}
        run: |
          set -euo pipefail

          # MARKER CONTRACT (also implemented by copilot-clean-label.yml cron):
          #   format:    <!-- copilot-fix-trigger:<HEAD_SHA> -->
          #   placement: last line of the @claude comment body
          #   author:    posted via PAT (kotakanbe), so the dedup query
          #              scopes to .user.login == "kotakanbe"
          #   prefix:    body starts with "@claude" so a quoted marker
          #              in human prose does not produce a false match
          # Marker auto-invalidates on push (new HEAD = new marker key).
          # If you change ANY part of this contract, update both files.
          #
          # LOCAL SUPPRESSION MARKER (posted by /review-until-clean Phase B):
          #   active form:    <!-- copilot-fix-local:<HEAD_SHA> -->
          #   converged form: <!-- copilot-fix-local-converged:<HEAD_SHA> -->
          # The event-driven Copilot review path also fires when the user is
          # actively iterating locally; without the suppression-marker check
          # we'd post a duplicate @claude trigger and start a CI
          # /review-until-clean run racing the local one. The active marker
          # has a 30-min TTL (heartbeated via PATCH); the converged marker
          # has no TTL (HEAD-scoped, cleared by next push). Same semantics
          # as the cron path in copilot-clean-label.yml.
          LOCAL_MARKER_MAX_AGE_MIN=30

          # Refresh HEAD_SHA at runtime, not from the event payload.
          # `cancel-in-progress: false` (above) means an older queued
          # event can run after a newer push has advanced the PR HEAD;
          # the payload-derived `github.event.pull_request.head.sha`
          # would then post a marker / `@claude` trigger keyed to a
          # stale SHA, while the cron / event-driven dedup looks up
          # the current SHA and would still post a duplicate trigger
          # for the newer HEAD. Read the current PR HEAD via
          # `gh pr view` and branch by event type:
          #
          #   AUTO event paths (`pull_request_review` /
          #   `pull_request_review_comment`):
          #     - on `gh pr view` error: fail-CLOSED (exit 0). The
          #       same Copilot review/comment that fired this run
          #       will re-fire on the next cron tick / re-request,
          #       so cron / a fresh Copilot review will eventually
          #       drive the PR forward without us posting a
          #       possibly-stale trigger now.
          #     - on payload-vs-current SHA mismatch: exit early. A
          #       fresh Copilot review/comment for the newer HEAD
          #       will fire its own event reaching this workflow,
          #       and if Copilot does NOT re-review, the cron
          #       fallback covers within ~30–60 min.
          #
          #   MANUAL label path (`pull_request` event):
          #     - on `gh pr view` error: fail-OPEN (fall back to
          #       payload SHA and proceed). The earlier step has
          #       already removed `copilot-review`, so a silent
          #       exit would leave the operator with no CI run and
          #       no feedback comment. Note: the manual label path
          #       intentionally bypasses both `already` /
          #       `local_in_progress` dedup checks below (escape
          #       hatch semantics), so this fallback may post a
          #       trigger keyed to a stale SHA — that is the
          #       documented trade-off for keeping the retry path
          #       actionable. Operator can re-attach the label
          #       (after manually removing it) once the API
          #       recovers if the stale-SHA trigger is unwanted.
          #     - on payload-vs-current SHA mismatch: proceed using
          #       the current SHA (no newer label-add event will
          #       reach this workflow because the label-add event
          #       has been consumed by the earlier remove step;
          #       skipping would silently no-op).
          payload_sha="${HEAD_SHA:-}"
          current_sha=""
          if ! current_sha=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefOid --jq '.headRefOid'); then
            current_sha=""
            if [ "${GITHUB_EVENT_NAME:-}" = "pull_request" ]; then
              # Manual label path: the earlier step has already
              # removed `copilot-review`, so an exit here would be
              # a silent no-op (no `@claude` trigger, no PR
              # feedback). Fall back to the payload SHA and
              # proceed. The operator gets a CI run for what we
              # can verify (payload HEAD), which is better than
              # nothing. (The manual label path bypasses the
              # `already` / `local_in_progress` dedup further
              # down — see "Manual label path bypasses both
              # suppressions" below — so this fallback may post a
              # trigger keyed to a stale SHA. Documented trade-off
              # for keeping the retry path actionable.)
              echo "::warning::PR #$PR_NUMBER: gh pr view --json headRefOid failed on manual label path — falling back to payload HEAD ($payload_sha) and proceeding (label was already removed; silent exit would break the manual retry path)"
              current_sha="$payload_sha"
            else
              # Auto event paths: skipping is safe — the same
              # Copilot review/comment that fired this run will
              # re-fire on the next cron tick / re-request, so
              # cron / a fresh Copilot review will eventually
              # drive this PR forward without us posting a
              # possibly-stale trigger now.
              echo "::warning::PR #$PR_NUMBER: gh pr view --json headRefOid failed on auto event path — skipping @claude trigger (will be re-driven by cron / next Copilot review)"
              exit 0
            fi
          fi
          if [ -z "$current_sha" ] || [ "${#current_sha}" -lt 40 ]; then
            echo "::warning::missing/short current PR HEAD '$current_sha' — skip @claude trigger"
            exit 0
          fi
          if [ -n "$payload_sha" ] && [ "$payload_sha" != "$current_sha" ]; then
            if [ "${GITHUB_EVENT_NAME:-}" = "pull_request" ]; then
              # Manual label path: the operator already chose to
              # engage CI by attaching `copilot-review`, and the
              # label-add event has already been consumed (the
              # earlier "Remove copilot-review label if present"
              # step ate the label). No newer event will reach this
              # workflow on this label-add, so a stale-SHA exit
              # here would be a silent no-op (label removed, no CI
              # run, no feedback comment for the operator). Proceed
              # using the current HEAD instead.
              echo "stale label event: payload HEAD=$payload_sha, current HEAD=$current_sha — proceeding with current HEAD (manual label path: no newer event will reach this workflow)"
            else
              # Auto event paths (`pull_request_review` /
              # `pull_request_review_comment`): a fresh Copilot
              # review/comment for the newer HEAD will fire its
              # own event reaching this workflow with the up-to-
              # date HEAD; if Copilot does NOT re-review, the
              # cron fallback in `copilot-clean-label.yml` covers
              # this PR within ~30–60 min. Either way, skipping
              # this stale-SHA run is correct.
              echo "stale auto event: payload HEAD=$payload_sha, current HEAD=$current_sha — skip @claude trigger (newer Copilot review/comment for current HEAD will fire its own event, otherwise cron fallback handles within ~30–60 min)"
              exit 0
            fi
          fi
          HEAD_SHA="$current_sha"
          if [ -z "${HEAD_SHA:-}" ] || [ "${#HEAD_SHA}" -lt 40 ]; then
            echo "::warning::missing/short HEAD_SHA '$HEAD_SHA' — skip @claude trigger"
            exit 0
          fi
          trigger_marker="<!-- copilot-fix-trigger:$HEAD_SHA -->"
          local_marker="<!-- copilot-fix-local:$HEAD_SHA -->"
          local_converged_marker="<!-- copilot-fix-local-converged:$HEAD_SHA -->"
          local_marker_cutoff=$(date -u -d "$LOCAL_MARKER_MAX_AGE_MIN minutes ago" +%Y-%m-%dT%H:%M:%SZ)

          # Capture stdout only; on failure gh writes diagnostics to stderr
          # which lands in the workflow log directly (visible without parsing).
          # Event-name discrimination:
          #   - manual label path (`pull_request` event): user
          #     explicitly added `copilot-review`. fail-OPEN on dedup
          #     fetch / parse failures (the previous step already
          #     removed the label, so silently dropping @claude would
          #     require the user to notice and re-add). `already`
          #     count ignores the converged marker so a successful
          #     `/review-until-clean` pass doesn't permanently block
          #     the manual escape hatch on the same HEAD.
          #   - event-driven path (`pull_request_review` /
          #     `pull_request_review_comment`): automatic Copilot-bot
          #     trigger. fail-CLOSED to avoid racing a local
          #     `/review-until-clean` Phase B session. `already`
          #     count includes the converged marker so a converged
          #     local session permanently suppresses CI rerun for
          #     this HEAD (avoids duplicate WONT_FIX replies).
          # Manual label path (`pull_request` event from
          # `copilot-review` label) is the documented escape-hatch
          # retry: skip BOTH dedups (no @claude `already` check, no
          # local-marker suppression) and unconditionally post the
          # trigger. The maintainer explicitly opted in.
          # Auto event paths (`pull_request_review` /
          # `pull_request_review_comment`) keep both dedups so the
          # cron-coordination contract holds.
          if [ "${GITHUB_EVENT_NAME:-}" = "pull_request" ]; then
            manual_label_path=1
            local_in_progress=0  # fail-OPEN — manual label path
            already_includes_converged=0
          else
            manual_label_path=0
            local_in_progress=1  # fail-CLOSED — auto-event paths
            already_includes_converged=1
          fi
          already=0
          if ! comments_json=$(gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments"); then
            if [ "$local_in_progress" = "1" ]; then
              echo "::warning::failed to fetch issue comments for marker dedup — treating as 'local in progress' (fail-closed for local marker on event-driven path)"
            else
              echo "::warning::failed to fetch issue comments for marker dedup — proceeding with post (fail-open on manual label path; user explicitly requested run)"
            fi
          else
            # @claude trigger dedup. The auto-event paths also count the
            # converged marker so a /review-until-clean B_CLEAN exit on
            # this HEAD permanently suppresses CI re-firing (avoids
            # duplicate WONT_FIX replies). The manual label path
            # ignores the converged marker — a maintainer explicitly
            # adding `copilot-review` after a converged session is
            # asking for a retry on this HEAD (e.g., to re-process a
            # WONT_FIX they want addressed now).
            if [ "$already_includes_converged" = "1" ]; then
              already=$(printf '%s' "$comments_json" | jq -s -r \
                  --arg trig "$trigger_marker" \
                  --arg conv "$local_converged_marker" '
                add // []
                | [.[] | select(
                    .user.login == "kotakanbe"
                    and .body != null
                    and (
                      ((.body | startswith("@claude")) and (.body | contains($trig)))
                      or (.body | startswith($conv))
                    )
                  )] | length
              ' 2>/dev/null || echo 0)
            else
              already=$(printf '%s' "$comments_json" | jq -s -r \
                  --arg trig "$trigger_marker" '
                add // []
                | [.[] | select(
                    .user.login == "kotakanbe"
                    and .body != null
                    and (.body | startswith("@claude"))
                    and (.body | contains($trig))
                  )] | length
              ' 2>/dev/null || echo 0)
            fi
            case "$already" in
              ''|*[!0-9]*) already=0 ;;
            esac
            # Local active-marker suppression — 30-min TTL on `updated_at`
            # (refreshed by skill heartbeat PATCH). The jq parse fallback
            # uses `$local_in_progress` (the event-aware default set
            # above) so a corrupt parse on the manual label path falls
            # OPEN (honor user intent) and on the event-driven path
            # falls CLOSED (avoid race).
            jq_default=$local_in_progress
            local_in_progress=$(printf '%s' "$comments_json" | jq -s -r \
                --arg m "$local_marker" \
                --arg cutoff "$local_marker_cutoff" '
              add // []
              | [.[] | select(
                  .user.login == "kotakanbe"
                  and .body != null
                  and (.body | startswith($m))
                  and (.updated_at >= $cutoff)
                )] | length
            ' 2>/dev/null || echo "$jq_default")
            case "$local_in_progress" in
              ''|*[!0-9]*) local_in_progress=$jq_default ;;
            esac
          fi
          # Manual label path bypasses both suppressions (see manual_label_path
          # rationale above). For auto-event paths the suppressions enforce the
          # cron-coordination contract.
          if [ "$manual_label_path" = "0" ]; then
            if [ "$local_in_progress" != "0" ]; then
              echo "local fix in progress for HEAD $HEAD_SHA (fresh markers=$local_in_progress, max age=${LOCAL_MARKER_MAX_AGE_MIN}min) — skip @claude trigger (event-driven path yields to /review-until-clean Phase B)"
              exit 0
            fi
            if [ "$already" != "0" ]; then
              echo "trigger already posted for HEAD $HEAD_SHA (count=$already) — skip"
              exit 0
            fi
          else
            echo "manual label path: bypassing dedup checks (already=$already, local_in_progress=$local_in_progress) — maintainer requested explicit retry"
          fi

          echo "Posting @claude trigger for HEAD $HEAD_SHA (event-driven path: $GITHUB_EVENT_NAME)"
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$(cat <<BODY
          @claude Run \`/review-until-clean\` for this PR (full Phase A+B+C: local agent review iteration → push + Copilot review iteration → reply+resolve all unresolved threads).

          $trigger_marker
          BODY
          )"
